# Optional local Postgres for running the app against a real database.
# The live app does not require Compose — it falls back to embedded Postgres.
#
#   docker compose up -d postgres
#   DATABASE_URL=postgres://trades:trades@localhost:5432/trades npm run dev
#
# Redis / BullMQ is the production scale-up path (see docs/architecture.md).
# It is intentionally not required to run this assessment.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trades
      POSTGRES_PASSWORD: trades
      POSTGRES_DB: trades
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trades -d trades"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
